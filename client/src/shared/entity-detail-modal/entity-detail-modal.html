<app-modal [isOpen]="isOpen()" [title]="title()" (closed)="closed.emit()">
  <div class="space-y-4">
    <input
      class="input input-bordered input-sm w-full"
      [placeholder]="namePlaceholder()"
      [value]="value()"
      (input)="value.set($any($event.target).value)"
      (keydown.enter)="onSave()"
    />
    @if (showEntranceInterest()) {
      <label class="form-control w-full">
        <span class="label-text text-xs mb-1">Interests (separate multiple with semicolons)</span>
        <input class="input input-bordered input-sm w-full" placeholder="Classes; Lecturer offices"
          [value]="interestValue()" (input)="interestValue.set($any($event.target).value)" />
        <span class="label-text-alt mt-1">Leave blank if this entrance serves all interests.</span>
      </label>
    }
    <div class="modal-action justify-between">
      <button type="button" class="btn btn-error btn-sm" (click)="delete.emit()">Delete</button>
      <div class="flex gap-2">
        <button type="button" class="btn btn-ghost btn-sm" (click)="closed.emit()">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" (click)="onSave()">Save</button>
      </div>
    </div>
  </div>
</app-modal>
