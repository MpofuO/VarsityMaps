<div class="mx-auto px-4 py-8 md:py-16 flex items-center justify-center min-h-[calc(100vh-8rem)]">
  <div class="card bg-base-100 w-full max-w-md shadow-xl border border-base-300/60 overflow-hidden">
    <div class="card-body p-6 md:p-10">
      
      <div class="space-y-1 text-center sm:text-left">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Sign in</h1>
        <p class="text-xs md:text-sm text-base-content/70">
          Enter your credentials to access your account.
        </p>
      </div>

      <form class="space-y-4 mt-4" [formGroup]="form" (ngSubmit)="submit()">
        <app-text-input
          label="Email Address"
          type="email"
          placeholder="name@example.com"
          formControlName="email"
          [errorMessages]="{ required: 'Email is required.', email: 'Please enter a valid email address.' }"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current text-base-content/40 absolute left-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </app-text-input>

        <app-text-input
          label="Password"
          type="password"
          placeholder="•••••••••"
          formControlName="password"
          [errorMessages]="{ required: 'Password is required.' }"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current text-base-content/40 absolute left-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </app-text-input>

        <button class="btn btn-primary w-full mt-6 shadow-sm" type="submit" [disabled]="form.invalid">
          Sign in
        </button>
      </form>

    </div>
  </div>
</div>
