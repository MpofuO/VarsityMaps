<div class="rounded-box border border-base-300 bg-base-100 p-3 flex flex-col min-h-0 shadow-sm">
  <div class="grid grid-cols-2 gap-2 mb-3 shrink-0">
    <button class="btn btn-primary btn-sm" [disabled]="isPlacingNodes() || isConnecting()"
      (click)="startPlacingNodes.emit()">
      Place path nodes
    </button>
    <button class="btn btn-outline btn-sm" [disabled]="isPlacingNodes() || isConnecting()"
      (click)="startConnecting.emit()">
      Quick connect
    </button>
  </div>

  <div class="text-xs font-semibold text-base-content/50 uppercase tracking-wider mb-2 px-1">
    Nodes ({{ nodes().length }})
  </div>

  <div class="overflow-y-auto flex-1 pr-1 space-y-1">
    @for (node of sortedNodes(); track node.nodeId) {
    <div id="node-{{ node.nodeId }}"
      class="group flex items-center justify-between rounded-btn p-2 cursor-pointer border border-transparent transition-all duration-150 hover:bg-base-200"
      [class.bg-primary/10]="node.nodeId === selectedNodeId()"
      [class.!border-primary]="node.nodeId === selectedNodeId()" 
      (click)="selectNode.emit(node.nodeId)">
      <span class="text-sm truncate flex-1">
        {{ node.name || 'Unnamed node' }}
        @if (node.buildingId) {
        <span class="badge badge-warning badge-xs ml-1">Entrance</span>
        }
      </span>
      <button class="btn btn-ghost btn-xs btn-square opacity-0 group-hover:opacity-100 transition-opacity shrink-0"
        title="Options" (click)="openDetail(node); $event.stopPropagation()">
        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
        </svg>
      </button>
    </div>
    } @empty {
    <div class="text-sm text-base-content/50 py-8 text-center">No nodes placed yet.</div>
    }
  </div>
</div>

<app-entity-detail-modal [isOpen]="isDetailOpen()" title="Edit node" [name]="detailTarget()?.name ?? null"
  namePlaceholder="Node name"
  [showEntranceInterest]="detailTarget()?.buildingId !== null && detailTarget()?.buildingId !== undefined"
  [interestOfEntrance]="detailTarget()?.interestOfEntrance ?? null" (save)="saveDetail($event)"
  (delete)="deleteDetail()" (closed)="closeDetail()" />
