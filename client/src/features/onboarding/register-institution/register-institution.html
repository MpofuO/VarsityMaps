<div class="mx-auto px-4 py-8 md:py-16 flex items-center justify-center min-h-[calc(100vh-8rem)]">
  <div class="card bg-base-100 w-full max-w-xl shadow-xl border border-base-300/60 overflow-hidden">
    <div class="card-body p-6 md:p-10">

      <div class="space-y-1 text-center sm:text-left">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Register your university</h1>
        <p class="text-xs md:text-sm text-base-content/70">
          Set up administrative access and configure your campus spatial network.
        </p>
      </div>

      <div class="py-4">
        <app-stepper [steps]="['Account Details', 'Institution Profile']" [currentStep]="step"></app-stepper>
      </div>

      @if (step === 0) {
      <form class="space-y-4" [formGroup]="personalForm" (ngSubmit)="nextStep()">
        <app-text-input
          label="Administrator Email"
          type="email"
          placeholder="admin@university.ac.za"
          formControlName="email"
          [errorMessages]="{ required: 'Email is required.', email: 'Please enter a valid email address.', emailTaken: 'This email is already registered.' }"
        >
          <svg xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 fill-current text-base-content/40 absolute left-3.5 top-1/2 -translate-y-1/2"
            viewBox="0 0 24 24">
            <path
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
          </svg>
        </app-text-input>

        <app-text-input
          label="Password"
          type="password"
          placeholder="••••••••"
          formControlName="password"
          [errorMessages]="{ required: 'Password is required.' }"
        >
          <svg xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 fill-current text-base-content/40 absolute left-3.5 top-1/2 -translate-y-1/2"
            viewBox="0 0 24 24">
            <path
              d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
          </svg>
        </app-text-input>

        <app-text-input
          label="Confirm Password"
          type="password"
          placeholder="••••••••"
          formControlName="confirmPassword"
          [errorMessages]="{ required: 'Please confirm your password.' }"
        >
          <svg xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 fill-current text-base-content/40 absolute left-3.5 top-1/2 -translate-y-1/2"
            viewBox="0 0 24 24">
            <path
              d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
          </svg>
        </app-text-input>

        <button class="btn btn-primary w-full mt-6 shadow-sm" type="submit" [disabled]="personalForm.invalid || isCheckingEmail()">
          @if (isCheckingEmail()) {
            <span class="loading loading-spinner loading-xs"></span>
            Checking email…
          } @else {
            Continue to Institution Profile
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                clip-rule="evenodd" />
            </svg>
          }
        </button>
      </form>
      } @else {
      <form class="space-y-4" [formGroup]="institutionForm" (ngSubmit)="submit()">
        <div class="form-control w-full">
          <label class="label pb-1">
            <span class="label-text font-medium text-xs">University Name</span>
          </label>
          <input class="input input-bordered w-full text-sm focus:input-primary transition-all"
            formControlName="universityName" placeholder="e.g. University of the Free State" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-control w-full">
            <label class="label pb-1">
              <span class="label-text font-medium text-xs">University Alias</span>
            </label>
            <input class="input input-bordered w-full text-sm focus:input-primary transition-all uppercase"
              formControlName="universityAlias" placeholder="e.g. UFS" />
          </div>
        </div>

        <div class="flex gap-3 pt-4">
          <button class="btn btn-ghost border border-base-300" type="button" (click)="prevStep()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                clip-rule="evenodd" />
            </svg>
            Back
          </button>
          <button class="btn btn-primary flex-1 shadow-sm" type="submit" [disabled]="institutionForm.invalid">
            Submit Application
          </button>
        </div>
      </form>
      }

    </div>
  </div>
</div>
